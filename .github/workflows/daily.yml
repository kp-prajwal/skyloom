name: Weave the sky

on:
  schedule:
    # Primary run plus two staggered recovery windows. GitHub can delay or
    # drop scheduled events during load spikes; the generator is idempotent,
    # so retries exit before external calls when today's record already exists.
    - cron: "7 7 * * *"
      timezone: "America/Chicago"
    - cron: "23 8 * * *"
      timezone: "America/Chicago"
    - cron: "41 9 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skyloom-daily
  cancel-in-progress: false

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Skyloom
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's morning
        run: python -m engine.daily
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Publish the new generation to the repository
        run: |
          git config user.name "skyloom[bot]"
          git config user.email "skyloom[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Paint morning $(date -u +%F)"
          git push
